project:
  name: counterfactual_mri_diffusion
  experiment_name: b1_20261016_01
  seed: 42
data:
  processed_dir: data/processed/ax_t1_128
  train_csv: data/processed/ax_t1_128/splits/train.csv
  val_csv: data/processed/ax_t1_128/splits/val.csv
  test_csv: data/processed/ax_t1_128/splits/test.csv
  image_size: 128
  image_channels: 1
  image_column: image_path
  manufacturer_column: manufacturer_label
  field_strength_column: field_strength_label
  echo_time_column: echo_time_norm
  num_workers: 0
  pin_memory: true
condition:
  num_manufacturers: 2
  num_field_strengths: 2
  manufacturer_embedding_dim: 32
  field_strength_embedding_dim: 32
  echo_embedding_dim: 32
  condition_dim: 128
  condition_dropout_prob: 0.1
model:
  in_channels: 1
  out_channels: 1
  base_channels: 64
  channel_multipliers:
  - 1
  - 2
  - 4
  time_embedding_dim: 128
  dropout: 0.1
diffusion:
  num_train_timesteps: 1000
  beta_schedule: linear
  beta_start: 0.0001
  beta_end: 0.02
  prediction_type: epsilon
sampling:
  num_inference_steps: 50
  guidance_scale: 3.0
  num_sample_images: 16
  sample_every_epochs: 5
training:
  device: cuda
  epochs: 200
  batch_size: 32
  learning_rate: 0.0001
  weight_decay: 1.0e-05
  grad_clip_norm: 1.0
  mixed_precision: true
  save_every_epochs: 10
  ema_decay: 0.999
debug:
  enabled: false
  max_steps: 200
paths:
  checkpoint_dir: checkpoints/diffusion/ax_t1_128_v4/b1_20261016_01
  latest_checkpoint: null
  best_checkpoint: null
  log_dir: reports/v4_diffusion/b1_20261016_01
  sample_dir: reports/v4_diffusion/b1_20261016_01/samples
  manufacturer_label_map: data/processed/ax_t1_128/label_maps/manufacturer_to_id.json
  field_strength_label_map: data/processed/ax_t1_128/label_maps/field_strength_to_id.json
  echo_time_stats: data/processed/ax_t1_128/label_maps/echo_time_stats.json
predictor_validation:
  enabled: true
  predictor_checkpoint: checkpoints/predictor/ax_t1_128/best.pt
