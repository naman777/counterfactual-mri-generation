# Diffusion Model Configuration
# Hyperparameters and architecture for the diffusion model

model:
  type: "DDPM"  # DDPM, DDIM, etc.
  input_channels: 1
  output_channels: 1
  num_channels: 64
  num_res_blocks: 2
  attention_resolutions: [16, 8]

diffusion:
  num_timesteps: 1000
  beta_schedule: "linear"  # linear, cosine, sqrt
  beta_start: 0.0001
  beta_end: 0.02

conditioning:
  conditional: true
  condition_dim: 128
  embedding_dim: 256

training:
  batch_size: 16
  num_epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.00001
  optimizer: "adam"
  warmup_steps: 5000
  
checkpointing:
  save_dir: "checkpoints/diffusion"
  save_interval: 5
  keep_best_only: true

inference:
  num_steps: 50  # DDIM steps
  guidance_scale: 7.5
