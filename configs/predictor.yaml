# Predictor Model Configuration
# Hyperparameters and architecture for the predictor network

model:
  type: "CNN"  # CNN, ResNet, DenseNet, etc.
  input_channels: 1
  num_classes: 2
  architecture:
    base_channels: 64
    num_layers: 4
    dropout_rate: 0.3

training:
  batch_size: 32
  num_epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: "adam"  # adam, sgd
  loss_function: "cross_entropy"
  scheduler: "cosine"  # cosine, step, exponential
  
validation:
  validation_interval: 5
  early_stopping_patience: 15
  early_stopping_metric: "val_loss"

checkpointing:
  save_dir: "checkpoints/predictor"
  save_interval: 5
  keep_best_only: true
