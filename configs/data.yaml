# Data Configuration
# Paths and parameters for data loading and preprocessing

data:
  raw_dir: "data/raw"
  interim_dir: "data/interim"
  processed_dir: "data/processed"
  metadata_dir: "data/metadata"

preprocessing:
  image_size: [256, 256]
  normalization_method: "minmax"  # minmax, zscore
  clip_lower: 0.0
  clip_upper: 1.0
  augmentation_enabled: true

train_val_split: 0.8
test_split: 0.1
random_seed: 42
